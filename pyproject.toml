[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-price-estimation-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "gunicorn>=23,<24",
    "joblib>=1.5,<2",
    "pandas>=2.2,<3",
    "pydantic-settings>=2.6,<3",
    "scikit-learn==1.7.1",
    "uvicorn[standard]>=0.32,<1",
    "xgboost==3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_price"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["notebooks/price_estimation_model_training.ipynb"]
